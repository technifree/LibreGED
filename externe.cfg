# externe.cfg — LibreGED
# Ce fichier vous permet d'associer des extensions de fichiers à des applications externes.
# Placez ce fichier dans le dossier racine de LibreGED (à côté de l'exécutable).
#
# FORMAT :
#   Extension.<EXT>
#   Chemin.<EXT>      = <chemin complet vers l'exécutable>
#   Parametres.<EXT>  = <paramètres optionnels>
#
# EXEMPLES :

# Ouvrir les fichiers .URL avec Google Chrome en mode incognito
Extension.URL
Chemin.URL     = C:\Program Files (x86)\Google\Chrome\Application\chrome.exe
Parametres.URL = --incognito

# Ouvrir les fichiers .MP3 avec VLC
Extension.MP3
Chemin.MP3     = C:\Program Files\VideoLAN\VLC\vlc.exe
Parametres.MP3 = --fullscreen

# Ouvrir les fichiers .MP4 avec VLC
Extension.MP4
Chemin.MP4     = C:\Program Files\VideoLAN\VLC\vlc.exe

# Sous Linux, adapter les chemins :
# Extension.MP3
# Chemin.MP3 = /usr/bin/vlc
# Parametres.MP3 = --fullscreen
