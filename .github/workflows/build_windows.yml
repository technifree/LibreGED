name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y pathlib 2>$null || true

      - name: Compiler avec PyInstaller
        run: |
          py -m PyInstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --icon=assets\icons\favicon.ico `
            --name=LibreGED `
            --distpath=dist `
            "--add-data=assets;assets" `
            "--add-data=files;files" `
            "--add-data=config.py;." `
            "--add-data=styles.py;." `
            --hidden-import=views `
            --hidden-import=views.main_window `
            --hidden-import=views.folder_browser `
            --hidden-import=database `
            --hidden-import=database.db `
            --hidden-import=database.reindex `
            --hidden-import=database.odf_utils `
            --hidden-import=database.path_utils `
            --hidden-import=pymupdf `
            --hidden-import=fitz `
            --hidden-import=numpy `
            --hidden-import=matplotlib `
            --hidden-import=pandas `
            --hidden-import=reportlab `
            --hidden-import=ebooklib `
            --hidden-import=bs4 `
            --hidden-import=odf `
            --hidden-import=docx `
            --hidden-import=openpyxl `
            --hidden-import=lxml `
            --hidden-import=pptx `
            --hidden-import=mammoth `
            --hidden-import=humanize `
            --hidden-import=qtawesome `
            --hidden-import=PIL `
            --hidden-import=PIL.Image `
            --hidden-import=PIL.ImageQt `
            --hidden-import=PySide6.QtWebEngineWidgets `
            --hidden-import=PySide6.QtWebEngineCore `
            --hidden-import=PySide6.QtWebEngine `
            --hidden-import=PySide6.QtPrintSupport `
            --collect-all=qtawesome `
            --collect-all=pymupdf `
            --collect-all=fitz `
            main.py

      - name: Créer l'archive ZIP
        run: Compress-Archive -Path dist\LibreGED -DestinationPath LibreGED-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreGED-windows
          path: LibreGED-windows.zip
          retention-days: 30
